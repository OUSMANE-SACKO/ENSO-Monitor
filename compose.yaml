# Étape 1 : uniquement PostgreSQL, pour le développement local.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: enso
      POSTGRES_PASSWORD: enso        # dev local uniquement
      POSTGRES_DB: enso
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
